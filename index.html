<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGIT Placement Portal | 2026-2027</title>

<!-- Font Awesome for sleek corporate icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* RESET & BASE STYLES */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* 2. BEAUTIFUL AMBIENT MESH BACKGROUND FOR SECTIONS (Distinct from dark header) */
body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    background-color: #f8fafc;
    background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.08) 0px, transparent 50%);
    background-attachment: fixed;
    color: #0f172a;
    min-height: 100vh;
    overflow-x: hidden;
}

/* FULL-WIDTH HEADER */
.header-container {
    width: 100%;
    background: linear-gradient(135deg, #071638 0%, #0d2558 100%);
    padding: 20px;
    text-align: center;
    border-bottom: 4px solid #ffd700;
    box-shadow: 0 4px 24px rgba(7, 22, 56, 0.35);
}

.header-container h1 {
    color: #ffd700;
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.3px;
    margin-bottom: 3px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
}

.header-container h2 {
    color: #ffffff;
    font-size: 1.08rem;
    font-weight: 600;
    opacity: 0.95;
    margin-bottom: 2px;
}

.header-container h3 {
    color: #fde68a;
    font-size: 0.88rem;
    font-weight: 500;
    letter-spacing: 0.5px;
}

/* MAIN CONTENT CONTAINER */
.main-wrapper {
    max-width: 1440px;
    margin: 28px auto;
    padding: 0 18px;
}

/* CATEGORIZED SECTION GRID */
.sections-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(295px, 1fr));
    gap: 22px;
    align-items: start;
}

/* FROSTED GLASS SECTION COLUMNS */
.section-column {
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 22px;
    padding: 18px;
    border: 1px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06), 0 4px 12px rgba(0, 0, 0, 0.02);
}

/* SECTION HEADER TITLE */
.section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 12px;
    margin-bottom: 16px;
    border-bottom: 2px solid rgba(226, 232, 240, 0.8);
    color: #0d2558;
}

.section-header i {
    font-size: 19px;
}

.section-header h4 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
}

.column-cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* 1. CIRCULAR CARDS WITH GLOWING BORDER EFFECTS */
.card {
    background: #ffffff;
    border-radius: 50px; /* Fully circular pill shape */
    padding: 6px 16px 6px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    outline: none;
    
    /* Dynamic Glowing Border via CSS Variables */
    border: 2px solid var(--glow-color, #2563eb);
    box-shadow: 
        0 0 10px var(--glow-shadow, rgba(37, 99, 235, 0.2)),
        inset 0 0 6px var(--glow-shadow, rgba(37, 99, 235, 0.08));
    
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* CIRCULAR 3D ICON BADGE */
.card .icon-badge {
    width: 40px;
    height: 40px;
    background: var(--badge-bg, linear-gradient(135deg, #2563eb 0%, #0d2558 100%));
    color: #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
    flex-shrink: 0;
    font-size: 17px;
    
    /* 3D Extrusion Shadow */
    box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.6),
        0 2px 0 var(--badge-shadow, #071638),
        0 4px 8px rgba(0, 0, 0, 0.15);
    
    filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.25));
    transition: all 0.22s ease;
}

/* CARD TEXT */
.card span {
    font-size: 12.5px;
    font-weight: 600;
    color: #1e293b;
    flex-grow: 1;
    line-height: 1.25;
    transition: color 0.2s ease;
}

/* CHEVRON ACTION INDICATOR */
.card .arrow-icon {
    font-size: 11px;
    color: var(--glow-color, #2563eb);
    margin-left: 6px;
    transition: transform 0.2s ease, opacity 0.2s ease;
    opacity: 0.7;
}

/* INTENSE HOVER & FOCUS GLOW STATES */
.card:hover, .card:focus-visible {
    transform: translateY(-3px) scale(1.01);
    
    /* Expanded Neon Glow Effect */
    box-shadow: 
        0 0 18px var(--glow-color, #2563eb),
        0 8px 20px rgba(0, 0, 0, 0.08);
}

.card:hover .icon-badge, .card:focus-visible .icon-badge {
    transform: scale(1.08) rotate(-3deg);
    color: #ffd700;
}

.card:hover span, .card:focus-visible span {
    color: #071638;
    font-weight: 700;
}

.card:hover .arrow-icon, .card:focus-visible .arrow-icon {
    opacity: 1;
    transform: translateX(4px);
}

.card:active {
    transform: translateY(-1px);
}

/* SECTION-SPECIFIC COLOR SCHEMES (BLUE, EMERALD, PURPLE, ROSE) */

/* Section 1: Student Data (Blue Glow) */
.sec-blue {
    --glow-color: #2563eb;
    --glow-shadow: rgba(37, 99, 235, 0.25);
    --badge-bg: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    --badge-shadow: #1e3a8a;
}
.sec-blue-header { color: #1d4ed8; }

/* Section 2: Company & Drives (Emerald Glow) */
.sec-emerald {
    --glow-color: #10b981;
    --glow-shadow: rgba(16, 185, 129, 0.25);
    --badge-bg: linear-gradient(135deg, #10b981 0%, #047857 100%);
    --badge-shadow: #064e3b;
}
.sec-emerald-header { color: #047857; }

/* Section 3: Reports & Accreditation (Purple Glow) */
.sec-purple {
    --glow-color: #8b5cf6;
    --glow-shadow: rgba(139, 92, 246, 0.25);
    --badge-bg: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
    --badge-shadow: #4c1d95;
}
.sec-purple-header { color: #6d28d9; }

/* Section 4: Admin & Operations (Rose Glow) */
.sec-rose {
    --glow-color: #f43f5e;
    --glow-shadow: rgba(244, 63, 94, 0.25);
    --badge-bg: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
    --badge-shadow: #881337;
}
.sec-rose-header { color: #be123c; }

/* RESPONSIVE ADJUSTMENTS */
@media (max-width: 640px) {
    .header-container h1 { font-size: 1.3rem; }
    .header-container h2 { font-size: 0.95rem; }
    .header-container h3 { font-size: 0.8rem; }
    .main-wrapper { padding: 0 10px; margin: 16px auto; }
    .sections-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<!-- Full-width Header -->
<header class="header-container">
    <h1>Mahatma Gandhi Institute of Technology</h1>
    <h2>Training and Placement Cell</h2>
    <h3>Academic Year 2026-2027</h3>
</header>

<!-- Main Dashboard Body with Mesh Background -->
<main class="main-wrapper">
    <div class="sections-grid" id="sectionsGrid"></div>
</main>

<script>
const csvLinks = {
    A:"https://docs.google.com/spreadsheets/d/e/2PACX-1vT4Yx068ZzCU8j4ouN_73-tolfsyoAO0skZWsGSc_4oZbACSlNGtpBCfaGQkpZfWg/pub?gid=1507961296&single=true&output=csv",
    B:"", C:"", D:"", E:"", F:"", G:"", H:"", I:"", J:"", K:"", L:"", M:"", N:"", O:"", P:"", Q:"", R:""
};

const cardNames = {
    A:"Total Students Data",
    B:"Students Enrollment & Selection Journey",
    C:"Placed Students Data with Offer Letters",
    D:"Companies JD & Mail Confirmation of Selected Students", 
    E:"HR Contact Details", 
    F:"Placement Report",
    G:"Training Programs with Profs",
    H:"Circulars",
    I:"On Campus Drives & Photos",
    J:"Salary Details", 
    K:"Memorandum of Understanding (MoU)",
    L:"Nature of Offers & Internship Details",
    M:"Employer Feedback & Survey Forms",
    N:"NBA Visit Details",
    O:"NAAC Visit Details",
    P:"Stock & Infrastructure Details",
    Q:"Budget Proposals",
    R:"Note Submitted to the Principal & Secretary"
};

const cardIcons = {
    A: '<i class="fa-solid fa-users"></i>',               
    B: '<i class="fa-solid fa-route"></i>',               
    C: '<i class="fa-solid fa-file-signature"></i>',       
    D: '<i class="fa-solid fa-envelope-open-text"></i>',  
    E: '<i class="fa-solid fa-address-book"></i>',        
    F: '<i class="fa-solid fa-chart-pie"></i>',           
    G: '<i class="fa-solid fa-chalkboard-user"></i>',     
    H: '<i class="fa-solid fa-bullhorn"></i>',            
    I: '<i class="fa-solid fa-camera"></i>',              
    J: '<i class="fa-solid fa-money-bill-wave"></i>',     
    K: '<i class="fa-solid fa-file-contract"></i>',       
    L: '<i class="fa-solid fa-business-time"></i>',       
    M: '<i class="fa-solid fa-comments"></i>',            
    N: '<i class="fa-solid fa-building-shield"></i>',     
    O: '<i class="fa-solid fa-award"></i>',               
    P: '<i class="fa-solid fa-boxes-stacked"></i>',       
    Q: '<i class="fa-solid fa-file-invoice-dollar"></i>', 
    R: '<i class="fa-solid fa-file-pen"></i>'             
};

/* CATEGORIZED SECTIONS CONFIGURATION WITH INDIVIDUAL GLOW THEMES */
const sections = [
    {
        title: "Student Data & Journey",
        icon: "fa-graduation-cap",
        themeClass: "sec-blue",
        headerClass: "sec-blue-header",
        keys: ["A", "B", "C", "G"]
    },
    {
        title: "Company & Drives",
        icon: "fa-city",
        themeClass: "sec-emerald",
        headerClass: "sec-emerald-header",
        keys: ["D", "E", "I", "K", "L"]
    },
    {
        title: "Reports & Accreditation",
        icon: "fa-chart-line",
        themeClass: "sec-purple",
        headerClass: "sec-purple-header",
        keys: ["F", "J", "M", "N", "O"]
    },
    {
        title: "Admin & Operations",
        icon: "fa-folder-gear",
        themeClass: "sec-rose",
        headerClass: "sec-rose-header",
        keys: ["H", "P", "Q", "R"]
    }
];

const sectionsGrid = document.getElementById("sectionsGrid");

// Build Categorized Columns & Cards dynamically
sections.forEach(sec => {
    const col = document.createElement("div");
    col.className = "section-column";

    let colHTML = `
        <div class="section-header ${sec.headerClass}">
            <i class="fa-solid ${sec.icon}"></i>
            <h4>${sec.title}</h4>
        </div>
        <div class="column-cards">
    `;

    sec.keys.forEach(key => {
        colHTML += `
            <div class="card ${sec.themeClass}" tabindex="0" onclick="handleCardClick('${key}')">
                <div style="display: flex; align-items: center; width: 85%;">
                    <div class="icon-badge">${cardIcons[key]}</div>
                    <span>${cardNames[key]}</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </div>
        `;
    });

    colHTML += `</div>`;
    col.innerHTML = colHTML;
    sectionsGrid.appendChild(col);
});

// Navigation Handler
function handleCardClick(key) {
    if(key === "A"){
        localStorage.setItem("csvURL", csvLinks[key]);
        window.location.href = "2027-Total_Students_Data.html";
    }
    else if(key === "B"){ window.location.href = "2027-Student_Enrollment_&_Selection_Journey.html"; }
    else if(key === "C"){ window.location.href = "Placed_Students_Data.html"; }
    else if(key === "D"){ window.location.href = "wipro.html"; }
    else if(key === "E"){ window.location.href = "capgemini.html"; }
    else if(key === "F"){ window.location.href = "cognizant.html"; }
    else if(key === "G"){ window.location.href = "HR_Contact_Details.html"; }
    else if(key === "H"){ window.location.href = "ibm.html"; }
    else if(key === "I"){ window.location.href = "techmahindra.html"; }
    else if(key === "J"){ window.location.href = "hcl.html"; }
    else if(key === "K"){ window.location.href = "oracle.html"; }
    else if(key === "L"){ window.location.href = "amazon.html"; }
    else if(key === "M"){ window.location.href = "google.html"; }
    else if(key === "N"){ window.location.href = "microsoft.html"; }
    else if(key === "O"){ window.location.href = "kpit.html"; }
    else if(key === "P"){ window.location.href = "zoho.html"; }
    else if(key === "Q"){ window.location.href = "hexaware.html"; }
    else if(key === "R"){ window.location.href = "genpact.html"; }
}
</script>

</body>
</html>
